{% extends "base.html" %}
{% block title %}修改密码 | {{ platform_name }} {{ platform_version }}{% endblock %}
{% block content %}
<section class="login-hero">
  <article class="login-card wide">
    <div class="panel-tag">账户安全</div>
    <h1>首次登录需要修改密码</h1>
    <p class="login-lead">为了保护报价、转码和历史记录数据，请设置一个只有你本人知道的新密码。</p>
    <form method="post" class="login-form">
      <label>
        <span>当前密码</span>
        <input type="password" name="old_password" required>
      </label>
      <label>
        <span>新密码</span>
        <input type="password" name="new_password" minlength="6" required>
      </label>
      <label>
        <span>确认新密码</span>
        <input type="password" name="confirm_password" minlength="6" required>
      </label>
      <button type="submit">保存新密码</button>
    </form>
  </article>
</section>
{% endblock %}
