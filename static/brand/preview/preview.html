<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NANYA Logo Preview</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f7fe;
        --ink: #151f5b;
        --muted: #6676a8;
        --panel: #ffffff;
        --line: #e8eefb;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 40px;
        background: var(--bg);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", sans-serif;
      }
      h1 { margin: 0 0 8px; font-size: 34px; }
      p { margin: 0 0 28px; color: var(--muted); }
      .grid {
        display: grid;
        grid-template-columns: 1.2fr .8fr;
        gap: 20px;
        align-items: stretch;
      }
      .card {
        padding: 24px;
        border-radius: 24px;
        background: var(--panel);
        box-shadow: 0 18px 40px rgba(112, 144, 176, .12);
      }
      .card h2 {
        margin: 0 0 18px;
        font-size: 18px;
      }
      .main img {
        display: block;
        width: min(420px, 100%);
        margin: 0 auto;
      }
      .samples {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .sample {
        display: grid;
        min-height: 150px;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: #fbfcff;
      }
      .sample span {
        align-self: end;
        margin-bottom: 14px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }
      .favicon-row {
        display: flex;
        align-items: end;
        justify-content: center;
        gap: 18px;
      }
      .dark {
        background: #111a4f;
      }
      .horizontal img {
        width: 100%;
      }
      @media (max-width: 900px) {
        body { padding: 22px; }
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <h1>NANYA Flywheel Logo Preview</h1>
    <p>蓝黄飞轮 + 隐含 N，先作为独立预览资产，不接入正式产品界面。</p>
    <div class="grid">
      <section class="card main">
        <h2>Main Mark</h2>
        <img src="./nanya-flywheel-mark.svg" alt="NANYA flywheel main mark">
      </section>
      <section class="card">
        <h2>Usage Samples</h2>
        <div class="samples">
          <div class="sample">
            <div class="favicon-row">
              <img src="./nanya-flywheel-favicon.svg" alt="" width="16" height="16">
              <img src="./nanya-flywheel-favicon.svg" alt="" width="32" height="32">
              <img src="./nanya-flywheel-favicon.svg" alt="" width="64" height="64">
            </div>
            <span>Favicon sizes</span>
          </div>
          <div class="sample">
            <img src="./nanya-flywheel-mark.svg" alt="" width="72" height="72">
            <span>Sidebar icon</span>
          </div>
          <div class="sample dark">
            <img src="./nanya-flywheel-favicon.svg" alt="" width="64" height="64">
            <span>Dark tab preview</span>
          </div>
          <div class="sample">
            <img src="./nanya-flywheel-mono.svg" alt="" width="72" height="72">
            <span>Monochrome</span>
          </div>
        </div>
      </section>
      <section class="card horizontal">
        <h2>Horizontal Lockup</h2>
        <img src="./nanya-flywheel-horizontal.svg" alt="NANYA Marketing OS horizontal logo">
      </section>
    </div>
  </body>
</html>
